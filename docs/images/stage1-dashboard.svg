<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
<rect width="1200" height="680" fill="#ffffff"/>
<rect width="270" height="680" fill="#f5f5f5"/>
<text x="28" y="58" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#303030">Inference settings</text>
<g font-family="Arial,sans-serif" fill="#343434">
<text x="28" y="112" font-size="15">Detection / tracking weights</text><rect x="28" y="126" width="214" height="42" rx="8" fill="#fff" stroke="#d6d6d6"/><text x="42" y="153" font-size="15">yolo11n.pt</text>
<text x="28" y="213" font-size="15">Pose weights</text><rect x="28" y="227" width="214" height="42" rx="8" fill="#fff" stroke="#d6d6d6"/><text x="42" y="254" font-size="15">yolo11n-pose.pt</text>
<text x="28" y="315" font-size="15">Confidence threshold</text><text x="28" y="365" font-size="14" fill="#c23b50">0.25</text><rect x="28" y="377" width="214" height="5" rx="3" fill="#ddd"/><circle cx="82" cy="379" r="8" fill="#c23b50"/>
<text x="28" y="435" font-size="15">Device (blank = auto)</text><rect x="28" y="449" width="214" height="42" rx="8" fill="#fff" stroke="#d6d6d6"/>
<text x="28" y="537" font-size="15">Maximum frames (0 = all)</text><rect x="28" y="551" width="214" height="42" rx="8" fill="#fff" stroke="#d6d6d6"/><text x="42" y="578" font-size="15">600</text>
</g>
<g font-family="Arial,sans-serif">
<text x="320" y="105" font-size="39" font-weight="700" fill="#303030">⚽ Real-Time Football Vision Lab</text>
<text x="320" y="145" font-size="17" fill="#777">Prototype: player tracking, pose estimation and inference profiling</text>
<rect x="320" y="176" width="840" height="82" rx="10" fill="#fff8e4"/>
<text x="340" y="211" font-size="16" fill="#9a6500">Baseline limitation: generic COCO weights are not trained for football broadcast footage.</text>
<text x="340" y="237" font-size="16" fill="#9a6500">Ball and event detection require sports-specific data and calibration.</text>
<text x="320" y="300" font-size="16" fill="#333">Upload a short gameplay/broadcast clip</text>
<rect x="320" y="315" width="840" height="65" rx="9" fill="#fafafa" stroke="#d8d8d8"/>
<text x="344" y="353" font-size="16" fill="#444">▣  Select a video file (MP4, MOV, AVI)</text>
<rect x="320" y="405" width="840" height="235" rx="10" fill="#f1f3f5" stroke="#d5d9dd"/>
<text x="740" y="500" text-anchor="middle" font-size="22" font-weight="700" fill="#46515c">Video preview hidden</text>
<text x="740" y="535" text-anchor="middle" font-size="15" fill="#66717c">Public portfolio illustration — no broadcast footage included</text>
</g></svg>