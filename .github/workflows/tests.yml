name: Football vision tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install video and OCR tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg tesseract-ocr-eng fonts-dejavu-core tesseract-ocr
      - name: Install Python dependencies
        run: |
          python -m pip install torch==2.8.0 torchvision==0.23.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python -m examples.fixture outputs/demo
